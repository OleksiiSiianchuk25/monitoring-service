<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Monitoring Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light p-5">

<div class="container bg-white p-4 rounded shadow-sm">

    <div sec:authorize="isAuthenticated()" class="d-flex justify-content-end align-items-center mb-3 pb-3 border-bottom">
        <span class="me-3 text-secondary">
            Вітаємо, <strong class="text-dark fs-5" sec:authentication="name"></strong>!
        </span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-sm btn-outline-danger fw-bold">Вийти</button>
        </form>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4 mt-2">
        <h2 class="text-primary m-0">📊 Monitoring Service</h2>
        <div class="d-flex gap-3 align-items-center">
            <form sec:authorize="hasRole('ADMIN')" th:action="@{/fetch}" method="post" class="m-0">
                <button type="submit" class="btn btn-success fw-bold">▶ Force Fetch</button>
            </form>
            <a th:href="@{/}" class="btn btn-outline-secondary">🔄 Refresh</a>
        </div>
    </div>

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <ul class="nav nav-tabs mb-4" id="dashboardTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active fw-bold" id="data-tab" data-bs-toggle="tab" data-bs-target="#data" type="button" role="tab" aria-selected="true">
                🗄️ Saved Users <span class="badge bg-secondary ms-1" th:text="${totalItems}">0</span>
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link fw-bold" id="audit-tab" data-bs-toggle="tab" data-bs-target="#audit" type="button" role="tab" aria-selected="false">
                📋 Job Audit Logs
            </button>
        </li>
    </ul>

    <div class="tab-content" id="dashboardTabsContent">

        <div class="tab-pane fade show active" id="data" role="tabpanel" tabindex="0">
            <table class="table table-hover table-bordered border-primary mt-3">
                <thead class="table-primary">
                <tr>
                    <th>External ID</th>
                    <th>Name</th>
                    <th>Username</th>
                    <th>Email</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td class="fw-bold text-muted" th:text="${'#' + user.externalId}"></td>
                    <td th:text="${user.name}"></td>
                    <td th:text="${user.username}"></td>
                    <td th:text="${user.email}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="4" class="text-center text-muted p-4">No data available yet. Click "Force Fetch".</td>
                </tr>
                </tbody>
            </table>

            <nav th:if="${totalPages > 1}" class="mt-4">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/(page=${currentPage - 1})}">Previous</a>
                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(startPage, endPage)}"
                        th:classappend="${currentPage == i ? 'active' : ''}">
                        <a class="page-link" th:href="@{/(page=${i})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{/(page=${currentPage + 1})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>

        <div class="tab-pane fade" id="audit" role="tabpanel" tabindex="0">
            <table class="table table-sm table-hover table-bordered align-middle">
                <thead class="table-light">
                <tr>
                    <th>Started</th>
                    <th>Status</th>
                    <th>Duration</th>
                    <th>Fetched</th>
                    <th>New</th>
                    <th>Updated</th>
                    <th>Unchanged</th>
                    <th>Skipped</th>
                    <th>Error</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="run : ${recentRuns}">
                    <td class="text-nowrap text-muted font-monospace"
                        th:text="${#temporals.format(run.startedAt.atZone(T(java.time.ZoneId).systemDefault()), 'HH:mm:ss')}">
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${run.status.name() == 'SUCCESS'} ? 'bg-success'
                                            : (${run.status.name() == 'FAILURE'} ? 'bg-danger' : 'bg-warning text-dark')"
                              th:text="${run.status}">STATUS</span>
                    </td>
                    <td class="font-monospace" th:with="ms=${run.finishedAt != null ? T(java.time.Duration).between(run.startedAt, run.finishedAt).toMillis() : 0}"
                        th:text="${run.finishedAt != null} ? ${ms} + ' ms' : '—'">—</td>
                    <td class="text-center" th:text="${run.fetchedCount}">0</td>
                    <td class="text-center text-success fw-bold" th:text="${run.newCount}">0</td>
                    <td class="text-center text-primary" th:text="${run.updatedCount}">0</td>
                    <td class="text-center text-secondary" th:text="${run.unchangedCount}">0</td>
                    <td class="text-center text-warning" th:text="${run.skippedCount}">0</td>
                    <td class="text-danger small" th:text="${run.errorMessage} ?: ''"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(recentRuns)}">
                    <td colspan="9" class="text-center text-muted p-4">No job runs recorded yet.</td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

</body>
</html>
